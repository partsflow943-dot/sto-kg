        /* БАЗОВЫЕ НАСТРОЙКИ И ШРИФТЫ */
        * {

            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

        body {

            color: #1A1A1A;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        a {

            color: inherit;
            transition: all 0.2s ease;
        }

        ul {
            list-style: none;
        }

        /* ШАПКА (КРАСНАЯ ПЛАШКА) */

        .header-grid {

            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-block {
            display: flex;
            flex-direction: column;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1;
        }

        .logo-sub {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
            opacity: 0.9;
        }

        .main-nav ul {

            gap: 25px;

        .main-nav a {

            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;

        .main-nav a:hover {

            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .sub-nav-list a {

            font-weight: 600;
            color: #4D4D4D;
        }

        .sub-nav-list a:hover {
            color: #E2231A;
        }

            padding: 80px 0;
            text-align: center;
        }

        .hero-title {
            font-size: 42px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .hero-subtitle {

            padding: 14px 28px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #E2231A;
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: #B01810;
        }

        .btn-secondary {
            background-color: transparent;
            border-color: #FFFFFF;
            color: #FFFFFF;
        }

        .btn-secondary:hover {
            background-color: #FFFFFF;
            color: #1A1A1A;

            left: 0;
            width: 60px;
            height: 3px;
            background-color: #E2231A;

            margin-bottom: 40px;

            border: 1px solid #E0E0E0;
        }

        .stat-num {

            font-weight: 900;
            color: #E2231A;
            line-height: 1;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 700;
            color: #4D4D4D;
            letter-spacing: 0.5px;
        }

        /* БРЕНДЫ */
        .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .brand-item {
            background-color: #F2F2F2;
            border: 1px solid #E0E0E0;
            padding: 15px;
            text-align: center;
            font-weight: 700;
            color: #4D4D4D;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* ТОЧКИ ПРОДАЖ */
        .locations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
        }

        .location-card {
            background-color: #FFFFFF;
            border: 1px solid #E0E0E0;
            display: flex;
            flex-direction: column;
        }

        .location-img-placeholder {
            background-color: #4D4D4D;
            color: #FFFFFF;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            background-image: repeating-linear-gradient(45deg, #3d3d3d, #3d3d3d 10px, #4d4d4d 10px, #4d4d4d 20px);
        }

        .location-info {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .location-name {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 2px solid #F2F2F2;
            padding-bottom: 10px;
        }

        .location-detail {
            font-size: 14px;
            margin-bottom: 10px;
            color: #1A1A1A;
        }

        .location-detail strong {
            color: #666666;
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .location-phones {
            margin-top: auto;
            padding-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-phone {
            background-color: #E2231A;
            color: #FFFFFF;
            text-align: center;
            padding: 10px 5px;
            font-size: 13px;
            font-weight: 700;
            border-bottom: 2px solid #B01810;
        }

        .btn-phone:hover {
            background-color: #B01810;
        }

        /* ФУТЕР */
        .main-footer {
            background-color: #4D4D4D;
            color: #FFFFFF;

        .footer-top {
            display: flex;

            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            border-bottom: 1px solid #666666;
            padding-bottom: 30px;
            margin-bottom: 30px;
        }

        .social-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
